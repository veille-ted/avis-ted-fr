name: Avis TED

on:
  schedule:
    - cron: '0 4 * * 1-5' # chaque jour ouvré, vers 5 h ou 6 h en France
  workflow_dispatch: {} # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write # écrire avis.json dans ce dépôt, rien d'autre

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # le jeton n'est donné qu'à l'étape de publication
      - run: node recuperer-avis.js # Node est déjà présent sur la machine de GitHub
      - name: Publier avis.json
        env:
          JETON: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avis.json
          git diff --cached --quiet || git commit -m "Avis TED du $(date +%F)"
          git push "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
