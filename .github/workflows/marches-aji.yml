name: Marchés AJI

on:
  schedule:
    - cron: '30 4 * * 1' # chaque lundi
  workflow_dispatch: {}

permissions:
  contents: write # écrire marches-aji.json dans ce dépôt, rien d'autre

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # le jeton n'est donné qu'à l'étape de publication
      - run: node recuperer-aji.js
      - name: Publier marches-aji.json
        env:
          JETON: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marches-aji.json
          git diff --cached --quiet || git commit -m "Marchés AJI du $(date +%F)"
          git pull --rebase "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
